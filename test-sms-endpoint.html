<!DOCTYPE html>
<html>
<head>
    <title>SMS Endpoint Test</title>
</head>
<body>
    <h1>SMS Gönderme Testi</h1>
    <button onclick="testSMS()">SMS Gönder</button>
    <pre id="result"></pre>

    <script>
    async function testSMS() {
        const resultEl = document.getElementById('result');
        resultEl.textContent = 'Gönderiliyor...';
        
        try {
            const response = await fetch('https://algi-akademi.replit.app/api/sms/send', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                credentials: 'include',
                body: JSON.stringify({
                    phoneNumber: '5551234567',
                    message: 'Test mesajı'
                })
            });
            
            console.log('Response status:', response.status);
            console.log('Response headers:', [...response.headers.entries()]);
            
            const text = await response.text();
            console.log('Response text:', text);
            
            try {
                const json = JSON.parse(text);
                resultEl.textContent = 'SUCCESS:\n' + JSON.stringify(json, null, 2);
            } catch (e) {
                resultEl.textContent = 'JSON PARSE ERROR:\n' + text + '\n\nError: ' + e.message;
            }
        } catch (error) {
            resultEl.textContent = 'FETCH ERROR:\n' + error.message;
        }
    }
    </script>
</body>
</html>
