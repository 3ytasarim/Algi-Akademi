<!DOCTYPE html>
<html>
<head>
    <title>Fix Production Test</title>
</head>
<body>
    <h1>Live Production Test</h1>
    <button onclick="liveTest()">Test Live Site</button>
    <div id="output"></div>
    
    <script>
        async function liveTest() {
            const output = document.getElementById('output');
            output.innerHTML = '<h3>Testing...</h3>';
            
            try {
                // 1. Test production API
                const response = await fetch('https://algi-akademi.replit.app/api/debug/course/Adli%20Sekreterlik/sections');
                const text = await response.text();
                
                let html = '<h3>1. Raw API Response:</h3><pre>' + text + '</pre>';
                
                // 2. Parse as JSON
                const data = JSON.parse(text);
                html += '<h3>2. Parsed Data:</h3>';
                
                // 3. Test section processing
                data.sections.forEach((section, index) => {
                    const name = section.name;
                    const title = section.title;
                    const lessonTitle = section.name || section.title || 'Ders ' + (index + 1);
                    
                    html += '<p><strong>Section ' + index + ':</strong></p>';
                    html += '<p>- Raw name: "' + name + '"</p>';
                    html += '<p>- Raw title: "' + (title || 'undefined') + '"</p>';
                    html += '<p>- Final lessonTitle: "' + lessonTitle + '"</p>';
                    html += '<p>- Toast message would be: "' + (lessonTitle || 'Ders materyali') + ' yeni sekmede açılıyor..."</p>';
                    html += '<hr>';
                });
                
                output.innerHTML = html;
                
            } catch (error) {
                output.innerHTML = '<h3>Error:</h3><p>' + error.message + '</p>';
            }
        }
    </script>
</body>
</html>
